[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wifiscan"
version = "0.2.2"
description = "sadrobot wifiscan – home network device inventory: who is on the WiFi, vendor, device type, running services (nmap), locations"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "sadrobot (Krisztián Hári)"}]
urls = {Homepage = "https://github.com/krisztianhari-wq/wifiscan"}
dependencies = []

[project.scripts]
wifiscan = "wifiscan.cli:main"

[tool.setuptools]
packages = ["wifiscan"]
