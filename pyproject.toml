[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wifiscan"
version = "0.2.0"
description = "Home network device inventory with a Hackerman-style GUI: who is on the WiFi, vendor, device type, running services (nmap)"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
wifiscan = "wifiscan.cli:main"

[tool.setuptools]
packages = ["wifiscan"]
